{% extends "base.html" %}

{% block title %}Add Goal{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <h2>Set New Goal</h2>
    </div>

    <form method="POST" class="goal-form">
        <div class="form-group">
            <label for="week_start">Week Starting (Monday) *</label>
            <input type="date" id="week_start" name="week_start" value="{{ week_start }}" required>
            <small>Select the Monday of the week for this goal</small>
        </div>

        <div class="form-group">
            <label for="title">Goal Title *</label>
            <input type="text" id="title" name="title" required placeholder="e.g., Complete project proposal">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Describe what you want to achieve..."></textarea>
        </div>

        <div class="form-group">
            <label for="target_hours">Target Hours (optional)</label>
            <input type="number" id="target_hours" name="target_hours" min="0.5" step="0.5" placeholder="e.g., 10">
            <small>How many hours do you want to spend on this goal?</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Goal</button>
            <a href="{{ url_for('goals') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
