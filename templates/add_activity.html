{% extends "base.html" %}

{% block title %}Add Activity{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <h2>Log New Activity</h2>
    </div>

    <form method="POST" class="activity-form">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="date">Date *</label>
                <input type="date" id="date" name="date" value="{{ today }}" required>
            </div>

            <div class="form-group">
                <label for="time">Time</label>
                <input type="time" id="time" name="time">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    {% for cat in categories %}
                    <option value="{{ cat.value }}">{{ cat.value.title() }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="duration">Duration (minutes)</label>
                <input type="number" id="duration" name="duration" min="1">
            </div>
        </div>

        <div class="form-group">
            <label for="tags">Tags (comma-separated)</label>
            <input type="text" id="tags" name="tags" placeholder="e.g., project, important, followup">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Activity</button>
            <a href="{{ url_for('activities') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
// Set default date to today
document.getElementById('date').valueAsDate = new Date();
</script>
{% endblock %}
