{% extends "base.html" %}

{% block title %}Edit Activity{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <h2>Edit Activity</h2>
    </div>

    <form method="POST" class="activity-form">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" value="{{ activity.title }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ activity.description }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="date">Date *</label>
                <input type="date" id="date" name="date" value="{{ activity.date }}" required>
            </div>

            <div class="form-group">
                <label for="time">Time</label>
                <input type="time" id="time" name="time" value="{{ activity.timestamp[11:19] if activity.timestamp|length > 11 else '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    {% for cat in categories %}
                    <option value="{{ cat.value }}" {% if activity.category == cat.value %}selected{% endif %}>{{ cat.value.title() }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="duration">Duration (minutes)</label>
                <input type="number" id="duration" name="duration" min="1" value="{{ activity.duration_minutes if activity.duration_minutes else '' }}">
            </div>
        </div>

        <div class="form-group">
            <label for="tags">Tags (comma-separated)</label>
            <input type="text" id="tags" name="tags" value="{{ ','.join(activity.tags) if activity.tags else '' }}">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Activity</button>
            <a href="{{ url_for('activities') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
